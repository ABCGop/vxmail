services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vxmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vxmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vxmail_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vxmail}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vxmail -d vxmail"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & BullMQ Message Broker
  redis:
    image: redis:7-alpine
    container_name: vxmail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Stalwart Mail Server (SMTP / IMAP / JMAP / DKIM / SPF / DMARC)
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: vxmail-stalwart
    restart: unless-stopped
    ports:
      - "25:25"       # Inbound SMTP
      - "587:587"     # Outbound Submission (STARTTLS)
      - "465:465"     # Outbound SMTPS (Implicit TLS)
      - "993:993"     # IMAP over SSL
      - "8080:8080"   # Management REST API / JMAP
    volumes:
      - stalwart_data:/opt/stalwart-mail
      - ./infrastructure/stalwart/config.toml:/opt/stalwart-mail/etc/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. VxMail Web Application (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vxmail-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vxmail:vxmail_secret_2026@postgres:5432/vxmail?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-jwt-key-min-32-chars-long-vxmusic}
      SMTP_HOST: stalwart
      SMTP_PORT: 587
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 6. VxMail Background Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: vxmail-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vxmail:vxmail_secret_2026@postgres:5432/vxmail?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: stalwart
      SMTP_PORT: 587
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  stalwart_data:
